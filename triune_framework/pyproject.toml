[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triune-framework"
version = "2.0.0"
description = "Universal High-Performance AI Framework Engine with CentroidSteer, FP8/FP4, and Memory Planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "datasets>=2.0.0",
    "tokenizers>=0.13.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
gui = [
    "pywebview>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
triune = "triune.cli:main"
